name: Check shared writing database

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the database without reading private words
        run: |
          node --input-type=module <<'JS'
          import {notesConfig} from './dist/notes-config.mjs';
          const response=await fetch(`${notesConfig.url}/rest/v1/rpc/notes_health`,{
            method:'POST',headers:{apikey:notesConfig.publishableKey,'Content-Type':'application/json'},body:'{}',
            signal:AbortSignal.timeout(30000)
          });
          if(!response.ok || await response.json()!==true)throw Error(`Database health check failed (${response.status})`);
          console.log('Shared writing database responded. No private notes were read.');
          JS
