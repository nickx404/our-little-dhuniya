name: Check private scrapbook availability

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the private API without reading private words
        run: |
          node --input-type=module <<'JS'
          import {notesConfig} from './dist/notes-config.mjs';
          const response=await fetch(new URL('api/health',notesConfig.privateSite),{
            signal:AbortSignal.timeout(30000)
          });
          if(!response.ok || (await response.json()).ok!==true)throw Error(`Private API health check failed (${response.status})`);
          console.log('Private API responded. No private notes were read.');
          JS
